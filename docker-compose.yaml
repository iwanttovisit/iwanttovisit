version: '3.0'

networks:
  iwtv:
    driver: bridge

volumes:
  db-data:

services:
  backend:
    build: ./backend
    platform: linux/amd64
    container_name: iwtv-backend
    restart: always
    ports:
      - '8080:8080'
    networks:
      - iwtv
    depends_on:
      - postgres
    environment:
      - HOST=postgres:5432
    env_file:
      - backend/.env
    volumes:
      - ./logs/core:/logs/core

  postgres:
    image: 'postgis/postgis:15-3.4-alpine'
    container_name: iwtv-postgres
    restart: always
    ports:
      - "5437:5432"
    networks:
      - iwtv
    env_file:
      - backend/.env
    volumes:
      - db-data:/var/lib/postgresql/data